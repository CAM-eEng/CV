name: refresh-activity

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: write # branch creation for the PR
  pull-requests: write # open + (auto-)merge the PR
  actions: write # dispatch deploy.yml after PR merge

concurrency:
  group: refresh-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      # persist-credentials: false is required by peter-evans/create-pull-request
      # — without it, actions/checkout v6 leaves a basic-auth header that the
      # PR-create action's git push then trips over with HTTP 400.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Refresh activity
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_LOGIN: CAM-eEng
          HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
          HTB_USER_ID: ${{ secrets.HTB_USER_ID }}
        run: bun run refresh-activity

      - name: Open / update PR if changed
        id: open-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(activity): nightly refresh'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: chore/refresh-activity
          delete-branch: true
          title: 'chore(activity): nightly refresh'
          body: |
            Automated activity refresh from the nightly workflow.

            - Bumps `data/activity.json` with current GitHub contributions, repos, languages, and (optionally) HackTheBox stats from `data/htb-manual.json` or the HTB API.
            - Re-opens / updates if a previous refresh PR is still open.

      - name: Enable auto-merge on the PR
        if: steps.open-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.open-pr.outputs.pull-request-number }} --squash --auto --delete-branch

      # GitHub's anti-recursion guard: pushes attributed to GITHUB_TOKEN
      # (including merges done via auto-merge by github-actions[bot]) do NOT
      # fire `push: main` triggers — meaning deploy.yml would otherwise sit
      # idle even after the refresh PR squash-merges. Wait for the merge to
      # land, then dispatch deploy.yml explicitly.
      - name: Wait for merge, then dispatch deploy
        if: steps.open-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ steps.open-pr.outputs.pull-request-number }}
          echo "Waiting up to 10 minutes for PR #$PR to auto-merge…"
          for i in $(seq 1 60); do
            state=$(gh pr view "$PR" --json state --jq '.state')
            echo "  attempt $i/60: state=$state"
            case "$state" in
              MERGED)
                echo "PR merged — dispatching deploy.yml on main."
                gh workflow run deploy.yml --ref main
                exit 0
                ;;
              CLOSED)
                echo "PR closed without merging — leaving deploy alone."
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::warning::Refresh PR #$PR did not merge within 10 minutes. Merge it manually and then run: gh workflow run deploy.yml --ref main"
