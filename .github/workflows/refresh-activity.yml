name: refresh-activity

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly
  workflow_dispatch:

# Deny everything at the workflow level; each job asks for only what it needs.
permissions: {}

concurrency:
  group: refresh-activity
  cancel-in-progress: false

jobs:
  # Job A — runs third-party code (bun install + our script) with the API
  # secrets, but holds only a read-only GITHUB_TOKEN. Its only output is
  # data/activity.json, handed to `publish` as an artifact.
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Refresh activity
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_LOGIN: CAM-eEng
          HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
          HTB_USER_ID: ${{ secrets.HTB_USER_ID }}
        run: bun run refresh-activity

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-json
          path: data/activity.json
          if-no-files-found: error
          retention-days: 1

  # Job B — holds the write-scoped GITHUB_TOKEN but no API secrets, and runs
  # no third-party code: no install step, no third-party actions, only
  # GitHub-owned actions plus git / gh / jq preinstalled on the runner. It
  # treats the artifact as data: sanity-checks it, commits it, never runs it.
  publish:
    needs: fetch
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the refresh branch
      pull-requests: write # open the PR + enable auto-merge
      actions: write # dispatch deploy.yml after the merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activity-json
          path: ${{ runner.temp }}/activity

      # The artifact must be exactly one JSON object of sane size. Full schema
      # validation already ran in `fetch` (ActivitySchema) and runs again at
      # build time in deploy.yml (loadActivity).
      - name: Check artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/activity
        run: |
          set -euo pipefail
          files=$(find "$ARTIFACT_DIR" -type f | wc -l)
          if [ "$files" -ne 1 ] || [ ! -f "$ARTIFACT_DIR/activity.json" ]; then
            echo "::error::Expected exactly one file, activity.json, in the artifact."
            exit 1
          fi
          size=$(stat -c %s "$ARTIFACT_DIR/activity.json")
          if [ "$size" -gt 2000000 ]; then
            echo "::error::activity.json is $size bytes (limit 2000000)."
            exit 1
          fi
          jq -e 'type == "object"' "$ARTIFACT_DIR/activity.json" > /dev/null
          cp "$ARTIFACT_DIR/activity.json" data/activity.json

      - name: Open / update PR if changed
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/refresh-activity
        run: |
          set -euo pipefail
          if git diff --quiet -- data/activity.json; then
            echo "No change to data/activity.json — nothing to publish."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add data/activity.json
          git commit -m 'chore(activity): nightly refresh'
          git push --force origin "$BRANCH"

          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(activity): nightly refresh' \
              --body "$(printf '%s\n' \
                'Automated activity refresh from the nightly workflow.' \
                '' \
                '- Bumps `data/activity.json` with current GitHub contributions, repos, languages, and (optionally) HackTheBox stats from `data/htb-manual.json` or the HTB API.' \
                '- Re-opens / updates if a previous refresh PR is still open.')"
            pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          fi
          echo "pull-request-number=$pr" >> "$GITHUB_OUTPUT"

      # main requires the `build-and-test` check, but pull_request runs on a PR
      # pushed by GITHUB_TOKEN are held for maintainer approval
      # (`action_required`) and never report — so auto-merge would wait
      # forever. A workflow_dispatch run is not held, and its build-and-test
      # check run lands on the same head commit, satisfying the requirement.
      - name: Run CI on the refresh branch
        if: steps.open-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref chore/refresh-activity

      - name: Enable auto-merge on the PR
        if: steps.open-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.open-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --squash --auto --delete-branch

      # GitHub's anti-recursion guard: pushes attributed to GITHUB_TOKEN
      # (including merges done via auto-merge by github-actions[bot]) do NOT
      # fire `push: main` triggers — meaning deploy.yml would otherwise sit
      # idle even after the refresh PR squash-merges. Wait for the merge to
      # land, then dispatch deploy.yml explicitly.
      - name: Wait for merge, then dispatch deploy
        if: steps.open-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.open-pr.outputs.pull-request-number }}
        run: |
          echo "Waiting up to 20 minutes for PR #$PR to auto-merge (CI runs first)…"
          for i in $(seq 1 120); do
            state=$(gh pr view "$PR" --json state --jq '.state')
            echo "  attempt $i/120: state=$state"
            case "$state" in
              MERGED)
                echo "PR merged — dispatching deploy.yml on main."
                gh workflow run deploy.yml --ref main
                exit 0
                ;;
              CLOSED)
                echo "PR closed without merging — leaving deploy alone."
                exit 0
                ;;
            esac
            sleep 10
          done
          # Fail loudly: a green run with a stuck PR hid stale data for months.
          echo "::error::Refresh PR #$PR did not merge within 20 minutes (check its CI). Once merged, run: gh workflow run deploy.yml --ref main"
          exit 1
